{% extends 'base.html' %}{% block content %}<h1>Scan History</h1><div class="card table"><table><tr><th>Date</th><th>File</th><th>Type</th><th>Prediction</th><th>Confidence</th></tr>{% for r in rows %}<tr><td>{{r['created_at']}}</td><td>{{r['filename']}}</td><td>{{r['media_type']}}</td><td>{{r['prediction']}}</td><td>{{r['confidence']}}%</td></tr>{% else %}<tr><td colspan="5">No scans yet.</td></tr>{% endfor %}</table></div>{% endblock %}
